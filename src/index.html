<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/stencil-reusable-web-components.esm.js"></script>
    <script nomodule src="/build/stencil-reusable-web-components.js"></script>
  </head>
  <body>
    <!-- <my-component first="Stencil" middle="'Don't call me a framework'" last="JS"></my-component> -->
    <!-- Primary Button -->
    <stn-button label="Submit" icon="true" variant="primary"></stn-button>

    <!-- Outline Button with Icon -->
    <stn-button label="Download"  variant="outline"></stn-button>

    <!-- Large Danger Button -->
    <stn-button label="Delete" variant="danger" size="large"></stn-button>

  </body>

  <script>
    document.querySelector('stn-button[label="Submit"]').addEventListener('action', () => {
      console.log("Submit Button Clicked !");
    });

    document.querySelector('stn-button[label="Download"]').addEventListener('action', () => {
      console.log("Download Button Clicked !");
    });

  </script>
</html>
